<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--border-color);
        }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        button.danger {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--danger-color);
            color: #fca5a5;
        }

        button.danger:hover {
            background-color: var(--danger-color);
            color: white;
        }

        /* 컨트롤 패널 및 영화 추가 영역 */
        .action-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 1rem;
            align-items: center;
        }

        @media (max-width: 768px) {
            .action-panel {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-group input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.7rem 1rem;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            align-self: flex-end;
        }

        /* 티어리스트 보드 */
        .tier-board {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .tier-row {
            display: flex;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            min-height: 120px;
        }

        .tier-label {
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            position: relative;
            padding: 0.5rem;
            text-align: center;
            word-break: break-all;
        }

        .tier-label .delete-tier-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: #fca5a5;
            font-size: 0.7rem;
            padding: 2px 5px;
            border-radius: 4px;
            cursor: pointer;
            display: none;
        }

        .tier-row:hover .delete-tier-btn {
            display: block;
        }

        .tier-dropzone {
            flex-grow: 1;
            padding: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            min-height: 120px;
        }

        .tier-dropzone.drag-over {
            background-color: rgba(59, 130, 246, 0.1);
            border: 2px dashed var(--accent-color);
        }

        /* 영화 카드 */
        .movie-card {
            width: 90px;
            height: 125px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: grab;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .movie-card:active {
            cursor: grabbing;
        }

        .movie-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .movie-card.dragging {
            opacity: 0.4;
        }

        .movie-poster {
            width: 100%;
            height: 95px;
            object-fit: cover;
            background-color: #27272a;
        }

        .movie-poster-placeholder {
            width: 100%;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #334155;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
            padding: 0.2rem;
        }

        .movie-title {
            padding: 4px 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-color: var(--panel-bg);
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-movie-btn {
            position: absolute;
            top: 3px;
            right: 3px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .movie-card:hover .delete-movie-btn {
            opacity: 1;
        }

        .delete-movie-btn:hover {
            background-color: var(--danger-color);
        }

        /* 미배치 영화 풀(Pool) 영역 */
        .unassigned-section {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            margin-top: 1rem;
        }

        .unassigned-section h3 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        /* 티어별 고유 색상 */
        .tier-s { background-color: #ef4444; }
        .tier-a { background-color: #f97316; }
        .tier-b { background-color: #eab308; }
        .tier-c { background-color: #84cc16; }
        .tier-d { background-color: #06b6d4; }
        .tier-e { background-color: #8b5cf6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 나의 영화 티어리스트</h1>
            <div class="controls">
                <button onclick="openAddTierModal()">티어 추가</button>
                <button class="danger" onclick="resetData()">초기화</button>
            </div>
        </header>

        <!-- 영화 추가 패널 -->
        <div class="action-panel">
            <div class="input-group">
                <label for="movieTitleInput">영화 제목</label>
                <input type="text" id="movieTitleInput" placeholder="예: 인셉션">
            </div>
            <div class="input-group">
                <label for="moviePosterInput">포스터 이미지 주소 (URL)</label>
                <input type="text" id="moviePosterInput" placeholder="https://example.com/poster.jpg 또는 파일 업로드 대체">
            </div>
            <div class="action-buttons">
                <button class="primary" onclick="addMovie()">영화 추가하기</button>
            </div>
        </div>

        <!-- 티어리스트 보드 -->
        <div class="tier-board" id="tierBoard">
            <!-- 동적 생성 -->
        </div>

        <!-- 미배치 영화 보관함 -->
        <div class="unassigned-section">
            <h3>미배치 영화 목록 (드래그해서 티어로 이동하세요)</h3>
            <div class="tier-dropzone" id="unassignedPool" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToPool(event)">
                <!-- 미배치 영화들 -->
            </div>
        </div>
    </div>

    <!-- 티어 추가 모달 -->
    <div class="modal" id="tierModal">
        <div class="modal-content">
            <h3>새 티어 추가</h3>
            <div class="input-group">
                <label for="newTierName">티어 이름 (예: F, EX 등)</label>
                <input type="text" id="newTierName" placeholder="티어 이름 입력">
            </div>
            <div class="modal-buttons">
                <button onclick="closeAddTierModal()">취소</button>
                <button class="primary" onclick="confirmAddTier()">추가</button>
            </div>
        </div>
    </div>

    <script>
        // 기본 데이터 구조
        let defaultTiers = [
            { id: 's', name: 'S', color: 'tier-s' },
            { id: 'a', name: 'A', color: 'tier-a' },
            { id: 'b', name: 'B', color: 'tier-b' },
            { id: 'c', name: 'C', color: 'tier-c' },
            { id: 'd', name: 'D', color: 'tier-d' },
            { id: 'e', name: 'E', color: 'tier-e' }
        ];

        let state = {
            tiers: defaultTiers,
            movies: [], // { id, title, poster, tierId }
            placements: {} // tierId: [movieId, movieId, ...] 또는 unassigned: [movieId, ...]
        };

        // 초기 데이터 로드 (LocalStorage)
        function loadData() {
            const saved = localStorage.getItem('movie_tier_list_state');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch (e) {
                    console.error('데이터 로드 실패:', e);
                    initDefaultState();
                }
            } else {
                initDefaultState();
            }
            render();
        }

        function initDefaultState() {
            state = {
                tiers: defaultTiers,
                movies: [
                    { id: 'm1', title: '인셉션', poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300', tierId: 's' },
                    { id: 'm2', title: '인터스텔라', poster: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=300', tierId: 'a' }
                ],
                placements: {}
            };
            saveData();
        }

        function saveData() {
            localStorage.setItem('movie_tier_list_state', JSON.stringify(state));
        }

        // 화면 렌더링
        function render() {
            const board = document.getElementById('tierBoard');
            board.innerHTML = '';

            state.tiers.forEach(tier => {
                const row = document.createElement('div');
                row.className = 'tier-row';

                const label = document.createElement('div');
                label.className = `tier-label ${tier.color || 'tier-s'}`;
                label.innerHTML = `
                    ${tier.name}
                    <button class="delete-tier-btn" onclick="deleteTier('${tier.id}')">삭제</button>
                `;

                const dropzone = document.createElement('div');
                dropzone.className = 'tier-dropzone';
                dropzone.id = `tier-${tier.id}`;
                dropzone.setAttribute('ondragover', 'allowDrop(event)');
                dropzone.setAttribute('ondragleave', 'removeDropStyle(event)');
                dropzone.setAttribute('ondrop', `dropToTier(event, '${tier.id}')`);

                row.appendChild(label);
                row.appendChild(dropzone);
                board.appendChild(row);
            });

            // 영화 카드 배치 채우기
            renderMovies();
        }

        function renderMovies() {
            // 모든 드롭존 비우기
            state.tiers.forEach(tier => {
                const dz = document.getElementById(`tier-${tier.id}`);
                if (dz) dz.innerHTML = '';
            });
            const poolDz = document.getElementById('unassignedPool');
            poolDz.innerHTML = '';

            state.movies.forEach(movie => {
                const card = createMovieCard(movie);
                const targetDz = document.getElementById(movie.tierId ? `tier-${movie.tierId}` : 'unassignedPool');
                if (targetDz) {
                    targetDz.appendChild(card);
                } else {
                    poolDz.appendChild(card);
                }
            });
        }

        function createMovieCard(movie) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.draggable = true;
            card.id = movie.id;
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);

            let posterHtml = '';
            if (movie.poster && movie.poster.trim() !== '') {
                posterHtml = `<img src="${movie.poster}" class="movie-poster" alt="${movie.title}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'movie-poster-placeholder\'>이미지 오류</div>';">`;
            } else {
                posterHtml = `<div class="movie-poster-placeholder">포스터 없음</div>`;
            }

            card.innerHTML = `
                ${posterHtml}
                <div class="movie-title" title="${movie.title}">${movie.title}</div>
                <button class="delete-movie-btn" onclick="deleteMovie('${movie.id}')" title="삭제">×</button>
            `;

            return card;
        }

        // 영화 추가
        function addMovie() {
            const titleInput = document.getElementById('movieTitleInput');
            const posterInput = document.getElementById('moviePosterInput');

            const title = titleInput.value.trim();
            const poster = posterInput.value.trim();

            if (!title) {
                alert('영화 제목을 입력해주세요.');
                titleInput.focus();
                return;
            }

            const newMovie = {
                id: 'm_' + Date.now(),
                title: title,
                poster: poster,
                tierId: null // 미배치로 시작
            };

            state.movies.push(newMovie);
            saveData();
            renderMovies();

            titleInput.value = '';
            posterInput.value = '';
        }

        // 영화 삭제
        function deleteMovie(movieId) {
            state.movies = state.movies.filter(m => m.id !== movieId);
            saveData();
            renderMovies();
        }

        // 티어 추가 모달 제어
        function openAddTierModal() {
            document.getElementById('tierModal').classList.add('active');
            document.getElementById('newTierName').value = '';
            document.getElementById('newTierName').focus();
        }

        function closeAddTierModal() {
            document.getElementById('tierModal').classList.remove('active');
        }

        function confirmAddTier() {
            const nameInput = document.getElementById('newTierName');
            const name = nameInput.value.trim();

            if (!name) {
                alert('티어 이름을 입력해주세요.');
                return;
            }

            const newId = 'tier_' + Date.now();
            const colors = ['tier-s', 'tier-a', 'tier-b', 'tier-c', 'tier-d', 'tier-e'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            state.tiers.push({
                id: newId,
                name: name,
                color: randomColor
            });

            saveData();
            closeAddTierModal();
            render();
        }

        // 티어 삭제
        function deleteTier(tierId) {
            if (state.tiers.length <= 1) {
                alert('최소 1개의 티어는 유지해야 합니다.');
                return;
            }

            if (confirm('해당 티어를 삭제하시겠습니까? 포함된 영화들은 미배치 목록으로 이동합니다.')) {
                state.tiers = state.tiers.filter(t => t.id !== tierId);
                // 해당 티어에 있던 영화들은 미배치로 변경
                state.movies.forEach(m => {
                    if (m.tierId === tierId) m.tierId = null;
                });
                saveData();
                render();
            }
        }

        // 드래그 앤 드롭 로직
        let draggedMovieId = null;

        function handleDragStart(e) {
            draggedMovieId = this.id;
            this.classList.add('dragging');
            e.dataTransfer.setData('text/plain', this.id);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.tier-dropzone').forEach(dz => dz.classList.remove('drag-over'));
        }

        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function removeDropStyle(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function dropToTier(e, tierId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            const movieId = e.dataTransfer.getData('text/plain') || draggedMovieId;
            const movie = state.movies.find(m => m.id === movieId);
            if (movie) {
                movie.tierId = tierId;
                saveData();
                renderMovies();
            }
        }

        function dropToPool(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            const movieId = e.dataTransfer.getData('text/plain') || draggedMovieId;
            const movie = state.movies.find(m => m.id === movieId);
            if (movie) {
                movie.tierId = null;
                saveData();
                renderMovies();
            }
        }

        // 초기화
        function resetData() {
            if (confirm('모든 데이터를 초기화하시겠습니까?')) {
                localStorage.removeItem('movie_tier_list_state');
                initDefaultState();
                render();
            }
        }

        // 페이지 로드 시 실행
        window.onload = loadData;
    </script>
</body>
</html>
